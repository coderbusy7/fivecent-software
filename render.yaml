# Fivecent production topology on Render.
# Services: API (webhook ingress) + ARQ worker + admin UI + Postgres + Redis.
# Admin stays separate; point ADMIN_API_BASE at the API HTTPS URL and share ADMIN_API_TOKEN.
# Migrations: run `python -m fivecent.adapters.persistence.migrate` as a one-off release
# step (or API preDeployCommand) before routing traffic — safe with multiple replicas
# because Alembic tracks schema version.
# Rollback: redeploy previous image/commit; schema rollbacks use `alembic downgrade -1`
# only after confirming the prior release is compatible.
# Probes: API liveness=/live readiness=/ready (dependency-aware).
# Backups: use Render Postgres continuous backups; see docs/ops-production.md for RPO/RTO.

databases:
  - name: fivecent-db
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: keyvalue
    name: fivecent-redis
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: fivecent-api
    runtime: python
    plan: starter
    buildCommand: pip install -e .
    preDeployCommand: python -m fivecent.adapters.persistence.migrate
    startCommand: uvicorn fivecent.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: APP_ENV
        value: production
      - key: ENABLE_TEST_CHAT
        value: "false"
      - key: QUEUE_BACKEND
        value: arq
      - key: DATABASE_URL
        fromDatabase:
          name: fivecent-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: fivecent-redis
          type: keyvalue
          property: connectionString
      - key: ADMIN_API_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_WABA_ID
        sync: false
      - key: WHATSAPP_CALLBACK_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: SEED_TENANT_ID
        value: port-vauban

  - type: worker
    name: fivecent-worker
    runtime: python
    plan: starter
    buildCommand: pip install -e .
    startCommand: arq fivecent.adapters.queue.arq_jobs.WorkerSettings
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: APP_ENV
        value: production
      - key: QUEUE_BACKEND
        value: arq
      - key: DATABASE_URL
        fromDatabase:
          name: fivecent-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: fivecent-redis
          type: keyvalue
          property: connectionString
      - key: ADMIN_API_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: SEED_TENANT_ID
        value: port-vauban

  - type: web
    name: fivecent-admin
    runtime: python
    plan: starter
    buildCommand: pip install -e ".[admin]"
    startCommand: ./admin.sh
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ADMIN_API_TOKEN
        sync: false
      # Set to the API public HTTPS URL, e.g. https://fivecent-api.onrender.com
      - key: ADMIN_API_BASE
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
