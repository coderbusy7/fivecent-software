name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit + lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/lock.txt
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/lock.txt
          python -m pip install -e ".[dev,admin]"
      - name: Syntax compile
        run: python -m compileall -q src admin e2e tests
      - name: Ruff lint
        run: python -m ruff check src admin e2e tests
      - name: Unit + admin UI tests
        run: |
          python -m pytest -q \
            --ignore=tests/integration \
            -m "not integration and not ai_live" \
            --junitxml=artifacts/junit-unit.xml
      - name: Upload unit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-unit-py${{ matrix.python-version }}
          path: artifacts/
          if-no-files-found: ignore

  integration:
    name: Postgres + Redis integration
    runs-on: ubuntu-latest
    needs: unit
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fivecent
          POSTGRES_PASSWORD: fivecent
          POSTGRES_DB: fivecent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fivecent -d fivecent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INTEGRATION_DATABASE_URL: postgresql+asyncpg://fivecent:fivecent@localhost:5432/fivecent_test
      INTEGRATION_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/lock.txt
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/lock.txt
          python -m pip install -e ".[dev,admin]"
      - name: Integration tests
        run: |
          mkdir -p artifacts
          python -m pytest -q tests/integration -m integration \
            --junitxml=artifacts/junit-integration.xml
      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-integration
          path: artifacts/
          if-no-files-found: ignore

  smoke-docs:
    name: Smoke docs present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require ops/CI docs
        run: |
          test -f docs/ci.md
          test -f docs/ops-production.md
          test -f requirements/lock.txt
          test -f render.yaml
