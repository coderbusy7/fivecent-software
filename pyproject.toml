[project]
name = "fivecent"
version = "0.1.0"
description = "Fivecent — multi-tenant messaging kernel with industry plugins"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "openai>=1.50",
    "anthropic>=0.40",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "redis>=5.2",
    "arq>=0.26",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
]
admin = [
    "streamlit>=1.39",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: requires live Postgres/Redis (set INTEGRATION_* URLs)",
    "ai_live: optional live LLM evaluations (not run in default CI)",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "admin", "e2e", "tests"]

[tool.ruff.lint]
# Keep CI lint focused; broaden gradually without a repo-wide style rewrite.
select = ["E", "F"]
ignore = [
    "E501",  # line length — prefer readability over hard wrap for now
]
